<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Orbit Rings -->
  <ellipse cx="250" cy="160" rx="190" ry="60" fill="none" stroke="#D99A19" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" transform="rotate(-15, 250, 160)"/>
  <ellipse cx="250" cy="160" rx="210" ry="75" fill="none" stroke="#0284C7" stroke-width="1" stroke-dasharray="10 8" opacity="0.4" transform="rotate(10, 250, 160)"/>

  <!-- 3D Globe -->
  <g transform="translate(190, 70)">
    <!-- Globe Shadow -->
    <ellipse cx="60" cy="140" rx="70" ry="16" fill="#0F172A" opacity="0.25"/>

    <!-- Globe Sphere -->
    <circle cx="60" cy="60" r="70" fill="url(#globeGrad)" filter="url(#glow)"/>

    <!-- Lat/Long Grid Lines -->
    <circle cx="60" cy="60" r="70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <ellipse cx="60" cy="60" rx="35" ry="70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="-10" y1="60" x2="130" y2="60" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <ellipse cx="60" cy="35" rx="55" ry="15" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.4"/>
    <ellipse cx="60" cy="85" rx="55" ry="15" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.4"/>

    <!-- Continents Silhouettes on Globe -->
    <path d="M40 20 Q55 15 65 30 T50 55 T35 45 Z" fill="url(#landGrad)" opacity="0.8"/>
    <path d="M75 35 Q95 40 100 65 T80 85 T60 70 Z" fill="url(#landGrad)" opacity="0.8"/>
    <path d="M25 65 Q45 75 40 100 T15 90 Z" fill="url(#landGrad)" opacity="0.8"/>
  </g>

  <!-- Flying Airplanes -->
  <g transform="translate(320, 45) rotate(-25) scale(0.65)">
    <path d="M0 20 L25 20 L35 0 L42 0 L37 20 L60 20 L68 12 L73 12 L70 24 L73 36 L68 36 L60 28 L37 28 L42 48 L35 48 L25 28 L0 28 Z" fill="#092957"/>
    <!-- Contrail -->
    <line x1="-100" y1="24" x2="-5" y2="24" stroke="#D99A19" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.8"/>
  </g>

  <g transform="translate(90, 80) rotate(15) scale(0.45)">
    <path d="M0 20 L25 20 L35 0 L42 0 L37 20 L60 20 L68 12 L73 12 L70 24 L73 36 L68 36 L60 28 L37 28 L42 48 L35 48 L25 28 L0 28 Z" fill="#092957"/>
    <line x1="-120" y1="24" x2="-5" y2="24" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 4" opacity="0.7"/>
  </g>

  <!-- Cargo Boxes & Pallets Stacked on Left -->
  <g transform="translate(110, 160) scale(0.8)">
    <!-- Pallet 1 (Cardboard brown) -->
    <polygon points="30,50 70,30 110,50 70,70" fill="#E2A01B"/>
    <polygon points="30,50 70,70 70,110 30,90" fill="#B45309"/>
    <polygon points="70,70 110,50 110,90 70,110" fill="#D97706"/>
    <!-- Tape / Ribbon -->
    <line x1="70" y1="30" x2="70" y2="70" stroke="#FEF3C7" stroke-width="3"/>
    <line x1="70" y1="70" x2="70" y2="110" stroke="#FEF3C7" stroke-width="3"/>

    <!-- Small Box on Top -->
    <polygon points="50,25 75,12 100,25 75,38" fill="#FBBF24"/>
    <polygon points="50,25 75,38 75,60 50,47" fill="#D97706"/>
    <polygon points="75,38 100,25 100,47 75,60" fill="#F59E0B"/>

    <!-- Another Box next to it -->
    <polygon points="5,80 35,65 65,80 35,95" fill="#E2A01B"/>
    <polygon points="5,80 35,95 35,125 5,110" fill="#92400E"/>
    <polygon points="35,95 65,80 65,110 35,125" fill="#B45309"/>
  </g>

  <!-- White Delivery Logistics Van / Truck in Foreground -->
  <g transform="translate(250, 155) scale(0.75)">
    <!-- Shadow -->
    <ellipse cx="140" cy="115" rx="100" ry="10" fill="#0F172A" opacity="0.3"/>

    <!-- Truck Body -->
    <rect x="30" y="30" width="130" height="70" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="40" y="45" width="110" height="4" fill="#D99A19"/>
    <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" fill="#092957">JOY TRADING</text>

    <!-- Cabin -->
    <path d="M160 45 L190 45 Q205 48 212 65 L220 85 Q222 90 222 100 L160 100 Z" fill="#F1F5F9" stroke="#CBD5E1"/>
    <path d="M168 50 L192 50 Q202 52 208 65 L214 78 L168 78 Z" fill="#38BDF8" opacity="0.8"/>
    <rect x="215" y="85" width="6" height="8" rx="2" fill="#FEF08A"/>

    <!-- Wheels -->
    <circle cx="65" cy="102" r="14" fill="#1E293B"/>
    <circle cx="65" cy="102" r="8" fill="#94A3B8"/>
    <circle cx="185" cy="102" r="14" fill="#1E293B"/>
    <circle cx="185" cy="102" r="8" fill="#94A3B8"/>
  </g>
</svg>
